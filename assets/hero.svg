    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="328" rx="17" fill="url(#grid)" stroke="#39FF14" stroke-opacity="0.45"/>
  <path d="M24 52V24H52 M1148 24H1176V52 M24 278V306H52 M1148 306H1176V278" fill="none" stroke="#39FF14" stroke-width="3"/>

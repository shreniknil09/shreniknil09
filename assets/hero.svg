  <desc id="desc">Futuristic black, white and green developer dashboard header.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020503"/>
      <stop offset="0.55" stop-color="#07100A"/>
      <stop offset="1" stop-color="#0B2112"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">

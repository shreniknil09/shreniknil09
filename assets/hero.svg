    <text x="42" y="82" fill="#FFFFFF" fill-opacity="0.62" font-size="12">USER: shreniknil09</text>
    <text x="42" y="103" fill="#FFFFFF" fill-opacity="0.62" font-size="12">MODE: BUILDING</text>
    <text x="42" y="124" fill="#FFFFFF" fill-opacity="0.62" font-size="12">STATUS: ONLINE</text>
